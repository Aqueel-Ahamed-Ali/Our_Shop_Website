<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== HEADER ===== */
    .site-header {
      background-color: #000000;
      padding: 5px 35px 5px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 200px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-container img {
      height: 120px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .shop-name {
      color: #ffffff;
      font-family: "Playfair Display", "Georgia", "Garamond", "Times New Roman", serif;
      font-weight: 700;
      font-size: 3.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1;
    }

    .navbar {
      display: flex;
      gap: 25px;
    }

    .navbar a {
      text-decoration: none;
      color: #ffffff;
      font-weight: 500;
      font-size: 1.25rem;
      transition: opacity 0.2s ease;
    }

    .navbar a:hover {
      opacity: 0.7;
    }

    @media (max-width: 600px) {
      .site-header {
        height: auto;
        padding: 12px 15px;
        flex-direction: column;
        gap: 10px;
      }
    }

    /* ===== MAIN CONTENT (grows to push footer down) ===== */
    main.page-content {
      flex: 1;
    }

    /* ===== PRODUCT CATALOG ===== */
    .catalog-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .catalog-title {
      font-size: 2rem;
      margin-bottom: 24px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 30px;
    }

    .product-card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    .product-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      background-color: #f5f5f5;
    }

    .product-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #111111;
    }

    .product-price {
      font-size: 1.2rem;
      font-weight: 700;
      color: #000000;
      margin-bottom: 16px;
    }

    .buy-btn {
      margin-top: auto;
      width: 100%;
      padding: 10px;
      background-color: #000000;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .buy-btn:hover {
      opacity: 0.8;
    }

    /* ===== FOOTER ===== */
    .site-footer {
      margin-top: auto;
      width: 100%;
      text-align: center;
      background-color: #000000;
      color: #faf6f6;
      padding: 10px 12px;
      border-top: 1px solid #eaeaea;
      font-size: 0.78rem;
    }
  </style>
</head>
<body>

  <!-- HEADER START -->
  <header class="site-header" id="home">
    <a href="#home" class="logo-container">
      <img src="laalib.jpg" alt="LAALIB Logo">
      <span class="shop-name">LAALIB</span>
    </a>
    <nav class="navbar">
      <a href="#home">Home</a>
      <a href="#catalog">Catalog & Prices</a>
      <a href="#contact">Contact Us</a>
    </nav>
  </header>
  <!-- HEADER END -->

  <!-- MAIN CATALOG CONTENT START -->
  <main class="page-content">
    <section class="catalog-container" id="catalog">
      <h1 class="catalog-title">Product Catalog</h1>

      <div class="product-grid">

        <!-- PRODUCT 1 -->
        <article class="product-card">
          <img src="product1.jpg" alt="Product Item 1" class="product-image">
          <div class="product-info">
            <h2 class="product-title">Classic Leather Item</h2>
            <p class="product-price">$49.99</p>
            <button class="buy-btn">Add to Cart</button>
          </div>
        </article>

        <!-- PRODUCT 2 -->
        <article class="product-card">
          <img src="product2.jpg" alt="Product Item 2" class="product-image">
          <div class="product-info">
            <h2 class="product-title">Premium Essential</h2>
            <p class="product-price">$79.99</p>
            <button class="buy-btn">Add to Cart</button>
          </div>
        </article>

        <!-- PRODUCT 3 -->
        <article class="product-card">
          <img src="product3.jpg" alt="Product Item 3" class="product-image">
          <div class="product-info">
            <h2 class="product-title">Signature Edition</h2>
            <p class="product-price">$99.99</p>
            <button class="buy-btn">Add to Cart</button>
          </div>
        </article>

        <!-- PRODUCT 4 -->
        <article class="product-card">
          <img src="product4.jpg" alt="Product Item 4" class="product-image">
          <div class="product-info">
            <h2 class="product-title">Modern Accessory</h2>
            <p class="product-price">$29.99</p>
            <button class="buy-btn">Add to Cart</button>
          </div>
        </article>

      </div>
    </section>
  </main>
  <!-- MAIN CATALOG CONTENT STOP -->

  <!-- FOOTER START -->
  <footer class="site-footer" id="contact">
    <p>&copy; <span id="year"></span> ABG. All rights reserved.</p>
  </footer>
  <!-- FOOTER END -->

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
