<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAALIB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== HEADER ===== */
    .site-header {
      background-color: #000000;
      padding: 12px 35px 12px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .logo-patch {
      background-color: #ece5db;
      border-radius: 12px;
      padding: 8px 20px;
      display: flex;
      align-items: center;
    }

    .logo-patch img {
      height: 64px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    @media (max-width: 600px) {
      .logo-patch { padding: 6px 14px; }
      .logo-patch img { height: 48px; }
    }

    .navbar {
      display: flex;
      gap: 25px;
    }

    .navbar a {
      text-decoration: none;
      color: #ffffff;
      font-weight: 500;
      font-size: 1.25rem;
      transition: opacity 0.2s ease;
    }

    .navbar a:hover { opacity: 0.7; }

    .navbar a[aria-current="page"] {
      border-bottom: 2px solid #a68a5b;
      padding-bottom: 2px;
    }

    @media (max-width: 600px) {
      .site-header {
        height: auto;
        padding: 12px 15px;
        flex-direction: column;
        gap: 10px;
      }
    }

    /* ===== MAIN CONTENT ===== */
    main.page-content { flex: 1; }

    /* ===== PRODUCT CATALOG ===== */
    .catalog-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .catalog-title {
      font-size: 2rem;
      margin-bottom: 24px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 30px;
    }

    /* Card is now a link, so we reset default link styling */
    .product-card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    .product-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      background-color: #f5f5f5;
    }

    .product-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #111111;
    }

    .product-price {
      font-size: 1.2rem;
      font-weight: 700;
      color: #000000;
      margin-bottom: 6px;
    }

    .product-colors-note {
      font-size: 0.82rem;
      color: #6b6b6b;
      margin-bottom: 16px;
    }

    .view-btn {
      margin-top: auto;
      width: 100%;
      padding: 10px;
      background-color: #000000;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      text-align: center;
      transition: opacity 0.2s ease;
    }

    .product-card:hover .view-btn { opacity: 0.8; }

    /* ===== FOOTER ===== */
    .site-footer {
      margin-top: auto;
      width: 100%;
      text-align: center;
      background-color: #000000;
      color: #faf6f6;
      padding: 10px 12px;
      border-top: 1px solid #eaeaea;
      font-size: 0.78rem;
    }
  </style>
</head>
<body>

  <!-- HEADER START -->
  <header class="site-header" id="home">
    <a href="index.html" class="logo-container">
      <span class="logo-patch">
        <img src="laalib1.jpg" alt="LAALIB Shop Logo">
      </span>
    </a>
    <nav class="navbar">
      <a href="index.html" aria-current="page">Home</a>
      <a href="index.html#catalog">Catalog &amp; Prices</a>
      <a href="about.html">About Us</a>
      <a href="about.html#contact-info">Contact Us</a>
    </nav>
  </header>
  <!-- HEADER END -->

  <!-- MAIN CATALOG CONTENT START -->
  <main class="page-content">
    <section class="catalog-container" id="catalog">
      <h1 class="catalog-title">Product Catalog</h1>

      <!-- Cards are generated by JavaScript from products.js — see buildCatalog() below -->
      <div class="product-grid" id="product-grid"></div>
    </section>
  </main>
  <!-- MAIN CATALOG CONTENT STOP -->

  <!-- FOOTER START -->
  <footer class="site-footer" id="contact">
    <p>&copy; <span id="year"></span> ABG. All rights reserved.</p>
  </footer>
  <!-- FOOTER END -->

  <!-- Load shared product data -->
  <script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const API_URL = "http://localhost:3000/api/products";

  // Format a number as Sri Lankan Rupees, e.g. 4999 -> "Rs. 4,999"
  function formatPrice(amount) {
    return "Rs. " + amount.toLocaleString("en-LK");
  }

  // If all colors share the same price, show one price.
  // If prices differ across colors, show "From Rs. X" (lowest price).
  function getPriceRangeLabel(product) {
    const prices = product.colors.map(c => c.price);
    const min = Math.min(...prices);
    const max = Math.max(...prices);
    return min === max ? formatPrice(min) : `From ${formatPrice(min)}`;
  }

  // Build one catalog card per product, using data fetched from the API
  function buildCatalog(products) {
    const grid = document.getElementById('product-grid');
    const cardsHtml = products.map(product => {
      const preview = product.colors[0];
      const priceRange = getPriceRangeLabel(product);
      const colorNote = product.colors.length > 1
        ? `${product.colors.length} colors available`
        : `1 color available`;

      return `
        <a class="product-card" href="product.html?id=${product._id}">
          <img
            class="product-image"
            src="${preview.image}"
            alt="${product.name} - ${preview.color}"
            loading="lazy"
          >
          <div class="product-info">
            <h2 class="product-title">${product.name}</h2>
            <p class="product-price">${priceRange}</p>
            <p class="product-colors-note">${colorNote}</p>
            <span class="view-btn">View Details</span>
          </div>
        </a>
      `;
    }).join('');

    grid.innerHTML = cardsHtml;
  }

  // Fetch products from the backend API and build the catalog
  async function loadCatalog() {
    const grid = document.getElementById('product-grid');
    try {
      const response = await fetch(API_URL);
      if (!response.ok) {
        throw new Error(`Server responded with status ${response.status}`);
      }
      const products = await response.json();
      buildCatalog(products);
    } catch (error) {
      console.error("Failed to load products:", error);
      grid.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: #999;">
        Unable to load products right now. Please try again shortly.
      </p>`;
    }
  }

  loadCatalog();
</script>

          ? `${product.colors.length} colors available`

          <a class="product-card" href="product.html?id=${product.id}">

              <h2 class="product-title">${product.name}</h2>
              <p class="product-price">${priceRange}</p>
              <p class="product-colors-note">${colorNote}</p>
              <span class="view-btn">View Details</span>
            </div>
          </a>
        `;
      }).join('');

      grid.innerHTML = cardsHtml;
    }

    // If all colors share the same price, show one price.
    // If prices differ across colors, show "From Rs. X" (lowest price).
    function getPriceRangeLabel(product) {
      const prices = product.colors.map(c => c.price);
      const min = Math.min(...prices);

      return min === max ? formatPrice(min) : `From ${formatPrice(min)}`;

  </script>

</body>
</html>
