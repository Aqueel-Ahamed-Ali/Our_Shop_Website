<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* PRODUCT CATALOG SECTION */
    .catalog-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .catalog-title {
      font-size: 2rem;
      margin-bottom: 24px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* GRID LAYOUT */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 30px;
    }

    /* PRODUCT CARD STYLING */
    .product-card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    .product-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      background-color: #f5f5f5;
    }

    .product-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #111111;
    }

    .product-price {
      font-size: 1.2rem;
      font-weight: 700;
      color: #000000;
      margin-bottom: 16px;
    }

    .buy-btn {
      margin-top: auto;
      width: 100%;
      padding: 10px;
      background-color: #000000;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .buy-btn:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <!-- MAIN CATALOG CONTENT  START here-->
  <main class="catalog-container">
    <h1 class="catalog-title">Product Catalog</h1>

    <div class="product-grid">

      <!-- PRODUCT 1 -->
      <article class="product-card">
        <img src="product1.jpg" alt="Product Item 1" class="product-image">
        <div class="product-info">
          <h2 class="product-title">Classic Leather Item</h2>
          <p class="product-price">$49.99</p>
          <button class="buy-btn">Add to Cart</button>
        </div>
      </article>

      <!-- PRODUCT 2 -->
      <article class="product-card">
        <img src="product2.jpg" alt="Product Item 2" class="product-image">
        <div class="product-info">
          <h2 class="product-title">Premium Essential</h2>
          <p class="product-price">$79.99</p>
          <button class="buy-btn">Add to Cart</button>
        </div>
      </article>

      <!-- PRODUCT 3 -->
      <article class="product-card">
        <img src="product3.jpg" alt="Product Item 3" class="product-image">
        <div class="product-info">
          <h2 class="product-title">Signature Edition</h2>
          <p class="product-price">$99.99</p>
          <button class="buy-btn">Add to Cart</button>
        </div>
      </article>

      <!-- PRODUCT 4 -->
      <article class="product-card">
        <img src="product4.jpg" alt="Product Item 4" class="product-image">
        <div class="product-info">
          <h2 class="product-title">Modern Accessory</h2>
          <p class="product-price">$29.99</p>
          <button class="buy-btn">Add to Cart</button>
        </div>
      </article>

    </div>
  </main>
     <!-- MAIN CATALOG CONTENT  STOP here-->

</body>
</html>
